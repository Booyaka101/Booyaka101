name: refresh profile

on:
  schedule:
    # 11:00 UTC lands after the breakage-radar crawl (~04:00) and after the
    # Daily Fable posts (18:00 +0800).
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    paths:
      - tools/build_profile.py
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The output is a pure function of remote data, never of repo history,
          # so if main moved under us we just resync and regenerate rather than
          # trying to rebase generated files.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"

            python tools/build_profile.py

            git add README.md assets
            if git diff --staged --quiet; then
              echo "nothing changed"
              exit 0
            fi
            git commit -m "Refresh live profile figures"
            if git push; then
              exit 0
            fi
            echo "push rejected, main moved. retrying ($attempt)"
          done
          echo "still could not push after 3 attempts"
          exit 1
